<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SnapEye Vite fixture</title>
    <style>
      html, body { margin: 0; min-height: 100%; background: #e9edf2; }
      body { display: grid; place-items: center; min-height: 100vh; font-family: system-ui, sans-serif; }
      #target {
        box-sizing: border-box;
        width: 320px;
        height: 180px;
        padding: 24px;
        border: 4px solid #172033;
        background: #f8c94c;
        color: #172033;
      }
      #target.changed { background: #5b5bd6; color: white; }
      #target.rotated { transform: rotate(30deg); }
      #motion { width: 32px; height: 32px; margin-top: 20px; background: currentColor; }
      #target.spinning #motion { animation: fixture-spin 900ms linear infinite; }
      #target.fading { animation: fixture-fade 1300ms ease-in-out infinite alternate; }
      @keyframes fixture-spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
      @keyframes fixture-fade { from { opacity: 0.35; } to { opacity: 1; } }
    </style>
  </head>
  <body>
    <main id="target">
      <strong id="label">baseline</strong>
      <div id="motion"></div>
    </main>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
